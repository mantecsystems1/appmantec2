name: Build Backend .NET (legado - deploy desativado)

# REPOSITORIO LEGADO (Mantec 2.0).
# A versao oficial em producao e o repositorio mantecsystems1/MantecAssistBack.
# O deploy no servidor foi desativado em 2026-11-08: este workflow apenas
# valida o build da imagem em um runner do GitHub, sem publicar no Docker Hub
# e sem tocar no servidor de producao (runner self-hosted).
# Para reativar, volte runs-on para [self-hosted, prod] e descomente os passos.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir versão
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build image (somente validação)
        run: |
          docker build \
            -t mantecsystems/mantec2-back:${IMAGE_TAG} \
            .

